<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>nieTTS - 文字转语音</title>
    <style>
        :root {
            --primary-color: #4e73df;
            --secondary-color: #f8f9fa;
            --text-color: #5a5c69;
            --border-radius: 0.5rem;
            --box-shadow: 0 0.15rem 1rem rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            padding: 1rem;
            background-color: #f8f9fc;
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            min-height: 100vh;
        }
        
        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
        }
        
        h1 {
            color: var(--primary-color);
            font-weight: 700;
            margin: 1.5rem 0;
            text-align: center;
        }
        
        .card {
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            border: none;
            background: white;
            margin-bottom: 1.5rem;
            overflow: hidden;
            transition: var(--transition);
        }
        
        .card-header {
            background-color: var(--primary-color);
            color: white;
            font-weight: 600;
            padding: 1rem;
            border-radius: var(--border-radius) var(--border-radius) 0 0;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-control, .form-select {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1px solid #d1d3e2;
            border-radius: var(--border-radius);
            font-size: 1rem;
            transition: var(--transition);
        }
        
        .form-control:focus, .form-select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.2rem rgba(78, 115, 223, 0.25);
            outline: none;
        }
        
        .btn-primary {
            display: inline-block;
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 1rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: var(--border-radius);
            cursor: pointer;
            transition: var(--transition);
        }
        
        .btn-primary:hover {
            background-color: #2e59d9;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        details {
            background: white;
            border-radius: var(--border-radius);
            margin-bottom: 1rem;
            box-shadow: var(--box-shadow);
        }

        summary {
            padding: 1rem;
            cursor: pointer;
            background-color: var(--secondary-color);
            border-radius: var(--border-radius);
            font-weight: 600;
            color: var(--text-color);
        }

        details[open] summary {
            border-bottom: 1px solid #e3e6f0;
            margin-bottom: 1rem;
        }

        .settings-content {
            padding: 0 1rem 1rem;
        }
        
        #logArea {
            height: 200px;
            overflow-y: auto;
            background-color: var(--secondary-color);
            border-radius: 0 0 0.35rem 0.35rem;
            padding: 1rem;
        }
        
        #logArea div {
            padding: 0.5rem;
            border-bottom: 1px solid #e3e6f0;
        }
        
        #logArea div:last-child {
            border-bottom: none;
        }
        
        @media (max-width: 768px) {
            .row {
                flex-direction: column;
            }
            
            .col-md-8, .col-md-4 {
                width: 100%;
                margin-bottom: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="mb-4">nieTTS</h1>
        
        <div class="row">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header">日志记录喵</div>
                    <div class="card-body" id="logArea"></div>
                </div>
            </div>

            <div class="col-md-12">
                <div class="form-group">
                    <label for="textInput" class="form-label">输入文本</label>
                    <input type="text" class="form-control" id="textInput" placeholder="请输入要转换的文本">
                </div>

                <button class="btn btn-primary mt-3" onclick="convertToSpeech()">
                    <i class="bi bi-soundwave me-2"></i>发送并提交osc
                </button>

                <details class="mt-4">
                    <summary>高级设置</summary>
                    <div class="settings-content">
                        <div class="form-group">
                            <label for="providerSelect" class="form-label">TTS服务商</label>
                            <select class="form-select" id="providerSelect">
                                {% for provider in tts_providers %}
                                <option value="{{ provider }}">{{ provider }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="voiceSelect" class="form-label">语音选择</label>
                            <select class="form-select" id="voiceSelect">
                                {% for voice in voices %}
                                <option value="{{ voice }}">{{ voice }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="deviceSelect" class="form-label">输出设备</label>
                            <select class="form-select" id="deviceSelect">
                                {% for device in audio_devices %}
                                <option value="{{ device }}">{{ device }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                </details>
            </div>
        </div>
    </div>

    <script>
        function convertToSpeech() {
            const text = document.getElementById('textInput').value.trim();
            if (!text) {
                alert('请输入要转换的文本');
                return;
            }

            const data = {
                text: text,
                provider: document.getElementById('providerSelect').value,
                voice: document.getElementById('voiceSelect').value,
                device: document.getElementById('deviceSelect').value
            };

            // 添加到日志
            const logArea = document.getElementById('logArea');
            logArea.innerHTML += `<div>${text}</div>`;
            logArea.scrollTop = logArea.scrollHeight;

            // 清空输入框
            document.getElementById('textInput').value = '';

            // 发送到服务器
            fetch('/tts', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    alert(data.error);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('转换失败，请查看控制台获取详细信息');
            });
        }

        // 支持按回车键提交
        document.getElementById('textInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                convertToSpeech();
            }
        });
    </script>
</body>
</html>
