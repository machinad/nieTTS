<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nieTTS - 文字转语音</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4e73df;
            --secondary-color: #f8f9fa;
            --text-color: #5a5c69;
        }
        
        body {
            padding: 20px;
            background-color: #f8f9fc;
            color: var(--text-color);
            font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        
        .container {
            max-width: 1200px;
        }
        
        h1 {
            color: var(--primary-color);
            font-weight: 700;
            margin-bottom: 2rem !important;
        }
        
        .card {
            border-radius: 0.35rem;
            box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.15);
            border: none;
        }
        
        .card-header {
            background-color: var(--primary-color);
            color: white;
            font-weight: 600;
            border-radius: 0.35rem 0.35rem 0 0 !important;
        }
        
        .form-control, .form-select {
            border-radius: 0.35rem;
            padding: 0.75rem 1rem;
            border: 1px solid #d1d3e2;
        }
        
        .form-control:focus, .form-select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.2rem rgba(78, 115, 223, 0.25);
        }
        
        .btn-primary {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            padding: 0.75rem 1.5rem;
            font-weight: 600;
            border-radius: 0.35rem;
            transition: all 0.2s;
        }
        
        .btn-primary:hover {
            background-color: #2e59d9;
            border-color: #2653d4;
            transform: translateY(-1px);
        }
        
        #logArea {
            height: 200px;
            overflow-y: auto;
            background-color: var(--secondary-color);
            border-radius: 0 0 0.35rem 0.35rem;
            padding: 1rem;
        }
        
        #logArea div {
            padding: 0.5rem;
            border-bottom: 1px solid #e3e6f0;
        }
        
        #logArea div:last-child {
            border-bottom: none;
        }
        
        @media (max-width: 768px) {
            .row {
                flex-direction: column;
            }
            
            .col-md-8, .col-md-4 {
                width: 100%;
                margin-bottom: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="mb-4">nieTTS - 文字转语音</h1>
        
        <div class="row">
            <div class="col-md-8">
                <div class="form-group">
                    <label for="textInput" class="form-label">输入文本</label>
                    <textarea class="form-control" id="textInput" rows="3" placeholder="请输入要转换的文本"></textarea>
                </div>

                <div class="form-group">
                    <label for="providerSelect" class="form-label">TTS服务商</label>
                    <select class="form-select" id="providerSelect">
                        {% for provider in tts_providers %}
                        <option value="{{ provider }}">{{ provider }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="voiceSelect" class="form-label">语音选择</label>
                    <select class="form-select" id="voiceSelect">
                        {% for voice in voices %}
                        <option value="{{ voice }}">{{ voice }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="deviceSelect" class="form-label">输出设备</label>
                    <select class="form-select" id="deviceSelect">
                        {% for device in audio_devices %}
                        <option value="{{ device }}">{{ device }}</option>
                        {% endfor %}
                    </select>
                </div>

                <button class="btn btn-primary mt-3" onclick="convertToSpeech()">
    <i class="bi bi-soundwave me-2"></i>转换为语音
</button>
            </div>

            <div class="col-md-4">
                <div class="card">
                    <div class="card-header">转换日志</div>
                    <div class="card-body" id="logArea"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function convertToSpeech() {
            const text = document.getElementById('textInput').value.trim();
            if (!text) {
                alert('请输入要转换的文本');
                return;
            }

            const data = {
                text: text,
                provider: document.getElementById('providerSelect').value,
                voice: document.getElementById('voiceSelect').value,
                device: document.getElementById('deviceSelect').value
            };

            // 添加到日志
            const logArea = document.getElementById('logArea');
            logArea.innerHTML += `<div>${text}</div>`;
            logArea.scrollTop = logArea.scrollHeight;

            // 清空输入框
            document.getElementById('textInput').value = '';

            // 发送到服务器
            fetch('/tts', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    alert(data.error);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('转换失败，请查看控制台获取详细信息');
            });
        }

        // 支持按回车键提交
        document.getElementById('textInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                convertToSpeech();
            }
        });
    </script>
</body>
</html>
